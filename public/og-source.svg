<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08100D"/>
      <stop offset="1" stop-color="#050908"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(210 90) scale(560 460)">
      <stop offset="0" stop-color="#2DDBA0" stop-opacity=".26"/>
      <stop offset="1" stop-color="#2DDBA0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 520) scale(520 420)">
      <stop offset="0" stop-color="#7C74FF" stop-opacity=".24"/>
      <stop offset="1" stop-color="#7C74FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BE8B0"/>
      <stop offset=".55" stop-color="#12C58C"/>
      <stop offset="1" stop-color="#7C74FF"/>
    </linearGradient>
    <linearGradient id="ghost" x1="820" y1="120" x2="1160" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DDBA0" stop-opacity=".20"/>
      <stop offset="1" stop-color="#7C74FF" stop-opacity=".06"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#E9F1ED" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <mask id="markMask">
      <rect width="32" height="32" fill="#000"/>
      <path d="M16 1.2 29.6 6.2V16.6C29.6 24 23.9 29.5 16 31.6 8.1 29.5 2.4 24 2.4 16.6V6.2Z" fill="#fff"/>
      <circle cx="16" cy="14.2" r="3.4" fill="#000"/>
      <path d="M13.75 16.6 12.6 23.6A1 1 0 0 0 13.6 24.7H18.4A1 1 0 0 0 19.4 23.6L18.25 16.6Z" fill="#000"/>
    </mask>
    <mask id="ghostMask">
      <rect width="32" height="32" fill="#000"/>
      <path d="M16 1.2 29.6 6.2V16.6C29.6 24 23.9 29.5 16 31.6 8.1 29.5 2.4 24 2.4 16.6V6.2Z" fill="#fff"/>
      <circle cx="16" cy="14.2" r="3.4" fill="#000"/>
      <path d="M13.75 16.6 12.6 23.6A1 1 0 0 0 13.6 24.7H18.4A1 1 0 0 0 19.4 23.6L18.25 16.6Z" fill="#000"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="url(#plate)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- oversized watermark of the mark on the right -->
  <g transform="translate(830 108) scale(13.4)" mask="url(#ghostMask)">
    <path d="M16 1.2 29.6 6.2V16.6C29.6 24 23.9 29.5 16 31.6 8.1 29.5 2.4 24 2.4 16.6V6.2Z" fill="url(#ghost)"/>
  </g>

  <!-- lockup -->
  <g transform="translate(80 64) scale(2.6)" mask="url(#markMask)">
    <path d="M16 1.2 29.6 6.2V16.6C29.6 24 23.9 29.5 16 31.6 8.1 29.5 2.4 24 2.4 16.6V6.2Z" fill="url(#mark)"/>
  </g>
  <text x="176" y="127" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#E9F1ED" letter-spacing="-1.4">Credo</text>
  <text x="176" y="155" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#2DDBA0" letter-spacing="2.6">ZERO KNOWLEDGE SHARING</text>

  <text x="80" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#E9F1ED" letter-spacing="-2">Send a secret that only</text>
  <text x="80" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#E9F1ED" letter-spacing="-2">the right person can open</text>

  <text x="80" y="416" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#9BB0A8">Encrypted in your browser with AES-256-GCM. The link expires on its own.</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">
    <rect x="80" y="456" width="228" height="50" rx="25" fill="#0F1A17" stroke="#22332C"/>
    <text x="106" y="487" fill="#CFE0D8">No server ever sees it</text>
    <rect x="324" y="456" width="196" height="50" rx="25" fill="#0F1A17" stroke="#22332C"/>
    <text x="350" y="487" fill="#CFE0D8">Links that expire</text>
    <rect x="536" y="456" width="176" height="50" rx="25" fill="#0F1A17" stroke="#22332C"/>
    <text x="562" y="487" fill="#CFE0D8">Notes or files</text>
  </g>

  <text x="80" y="576" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#2DDBA0" letter-spacing=".2">lowkey.tools/credo</text>
</svg>
