<svg xmlns="http://www.w3.org/2000/svg" width="630" height="630" viewBox="0 0 630 630">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="630" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08100D"/>
      <stop offset="1" stop-color="#050908"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(140 70) scale(430 380)">
      <stop offset="0" stop-color="#2DDBA0" stop-opacity=".26"/>
      <stop offset="1" stop-color="#2DDBA0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(540 570) scale(380 330)">
      <stop offset="0" stop-color="#7C74FF" stop-opacity=".26"/>
      <stop offset="1" stop-color="#7C74FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BE8B0"/>
      <stop offset=".55" stop-color="#12C58C"/>
      <stop offset="1" stop-color="#7C74FF"/>
    </linearGradient>
    <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M45 0H0V45" fill="none" stroke="#E9F1ED" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <mask id="markMask">
      <rect width="32" height="32" fill="#000"/>
      <path d="M16 1.2 29.6 6.2V16.6C29.6 24 23.9 29.5 16 31.6 8.1 29.5 2.4 24 2.4 16.6V6.2Z" fill="#fff"/>
      <circle cx="16" cy="14.2" r="3.4" fill="#000"/>
      <path d="M13.75 16.6 12.6 23.6A1 1 0 0 0 13.6 24.7H18.4A1 1 0 0 0 19.4 23.6L18.25 16.6Z" fill="#000"/>
    </mask>
  </defs>

  <rect width="630" height="630" fill="url(#plate)"/>
  <rect width="630" height="630" fill="url(#grid)"/>
  <rect width="630" height="630" fill="url(#glowA)"/>
  <rect width="630" height="630" fill="url(#glowB)"/>

  <g transform="translate(251 92) scale(4)" mask="url(#markMask)">
    <path d="M16 1.2 29.6 6.2V16.6C29.6 24 23.9 29.5 16 31.6 8.1 29.5 2.4 24 2.4 16.6V6.2Z" fill="url(#mark)"/>
