  <g text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="315" y="285" font-size="58" font-weight="700" fill="#E9F1ED" letter-spacing="-1.6">Credo</text>
    <text x="315" y="316" font-size="16" font-weight="500" fill="#2DDBA0" letter-spacing="3">ZERO KNOWLEDGE SHARING</text>

    <text x="315" y="392" font-size="34" font-weight="700" fill="#E9F1ED" letter-spacing="-0.9">Send a secret that only</text>
    <text x="315" y="434" font-size="34" font-weight="700" fill="#E9F1ED" letter-spacing="-0.9">the right person can open</text>

    <text x="315" y="486" font-size="19" font-weight="400" fill="#9BB0A8">Encrypted in your browser. The link expires</text>
    <text x="315" y="512" font-size="19" font-weight="400" fill="#9BB0A8">on its own. No account, no tracking.</text>

    <text x="315" y="570" font-size="19" font-weight="600" fill="#2DDBA0">lowkey.tools/credo</text>
